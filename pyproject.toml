[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layercollapse"
version = "0.1.0"
description = "Layer-wise information compression and signal preservation as a collapse diagnostic"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel"]
# Kernels CUDA para Mamba (solo Linux + GPU, p. ej. en la DGX).
# Sin ellos, transformers usa la implementación lenta, válida para desarrollo en local.
mamba = ["mamba-ssm", "causal-conv1d"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
